    box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(16,24,40,.05),0 12px 32px rgba(16,24,40,.06);
    overflow:hidden;touch-action:none;container-type:size;
  }
  @supports (width:1cqw){#stage{--u:calc(100cqw/11.7)}}
  #scene,#back,#layer,#frame{position:absolute;inset:0}
  #layer{z-index:1}#frame{z-index:2}               /* squares (whatever their raise-to-front number) always stay below the triangle outline and the name tag */
  #frame{pointer-events:none}
  .bx{position:absolute;box-sizing:border-box;left:calc(var(--u)*var(--x));top:calc(var(--u)*var(--y));width:calc(var(--u)*var(--w));height:calc(var(--u)*var(--h))}

         background:#7dd3fc;border-radius:50% 0 50% 50%;transform:rotate(45deg);border:calc(var(--u)*.015) solid #fff}

     box-shadow:calc(var(--c)*-20) calc(var(--c)*10) 0 calc(var(--c)*-2) var(--hc),calc(var(--c)*20) calc(var(--c)*10) 0 calc(var(--c)*-2) var(--hc),calc(var(--c)*-9) calc(var(--c)*-8) 0 calc(var(--c)*3) var(--hc),calc(var(--c)*10) calc(var(--c)*-7) 0 calc(var(--c)*2) var(--hc)}

  .hr-semi .inner i.hair::before{left:calc(var(--c)*3)}.hr-semi .inner i.hair::after{right:calc(var(--c)*3)}
  .gl .inner i.glasses{display:block;left:50%;top:calc(50% + calc(var(--c)*-7));width:calc(var(--c)*13);height:0;margin-left:calc(var(--c)*-6.5);border-top:calc(var(--c)*2.5) solid #1f2937}

  .ac-tie .inner i.acc{display:block;left:50%;bottom:calc(var(--c)*2);width:calc(var(--c)*16);height:calc(var(--c)*16);margin-left:calc(var(--c)*-8);background:#b91c1c;clip-path:polygon(32% 0,68% 0,60% 22%,84% 100%,50% 86%,16% 100%,40% 22%)}

<script>
(function(){
const stage=document.getElementById('stage'),back=document.getElementById('back'),layer=document.getElementById('layer');
const OX=4.35,OY=8.45,UW=11.7;
const HROT=-36.87, PLACED=1.075, LIFT=1.12;
const $=id=>document.getElementById(id);
const tag=$('tag');
const i18n=[...document.querySelectorAll('[data-ar]')];
i18n.forEach(el=>{el.dataset.en=el.textContent});
let ar=false;
const ARD='٠١٢٣٤٥٦٧٨٩';
const N=n=>ar?String(n).replace(/\d/g,d=>ARD[d]):String(n);       // digits turn Arabic-Indic too
function setLang(on){                                              // the whole screen flips to Arabic, with a glitch
  if(ar===on)return;ar=on;
  document.body.classList.add('glitch');setTimeout(()=>document.body.classList.remove('glitch'),460);
  document.body.classList.toggle('ar',on);document.documentElement.lang=on?'ar':'en';
  i18n.forEach(el=>{el.textContent=on?el.dataset.ar:el.dataset.en});
  updateCount();
}
const SPK_ON='<svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>';
const SPK_OFF='<svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M22 9l-6 6"/><path d="M16 9l6 6"/></svg>';

const pieces=[...layer.querySelectorAll('.piece')].map(el=>{
  const hx=+el.dataset.hx,hy=+el.dataset.hy;
  return{el,inner:el.querySelector('.inner'),kind:el.dataset.kind,name:el.dataset.name||'',home:{x:hx,y:hy},
    x:hx,y:hy,rot:0,s:1,tx:hx,ty:hy,trot:0,ts:1,cell:null,dragging:false,last:''};
});
const cells=[...back.querySelectorAll('.cell')].map(el=>({el,box:'h',i:+el.dataset.i,j:+el.dataset.j,c:{x:+el.dataset.cx,y:+el.dataset.cy},piece:null}));
const legSlots=[...back.querySelectorAll('.slot')].map(el=>({el,box:el.dataset.box,c:{x:+el.dataset.cx,y:+el.dataset.cy},piece:null}));
const slots=cells.concat(legSlots);                      // 25 + 9 + 16 places a square can sit in
pieces.forEach(p=>{
  p.slot=legSlots.find(s=>Math.abs(s.c.x-p.home.x)<.01&&Math.abs(s.c.y-p.home.y)<.01);
  p.slot.piece=p;p.homeSlot=p.slot;p.out=false;p.who=(p.el.className.match(/c-([a-z]+)/)||[0,''])[1];
});
const MINX=-4.35+.5,MAXX=7.35-.5,MINY=-8.45+.5,MAXY=4.25-.5;   // squares can never leave the main card

/* ---------- every square rests with a smile; now and then one suddenly screams with joy, then calms down ---------- */
(function joyLoop(){
  setTimeout(()=>{
    if(!document.hidden&&!busy&&!plain&&!lite){
      const pool=pieces.filter(p=>!p.dragging&&!p.out&&p.who!=='somia'&&!p.el.classList.contains('joy')&&!p.el.classList.contains('spider'));
      const p=pool[Math.floor(Math.random()*pool.length)];
      if(p){p.el.classList.add('joy');setTimeout(()=>p.el.classList.remove('joy'),900+Math.random()*800)}
    }
    joyLoop();
  },1100+Math.random()*2400);
})();

/* ---------- easing loop: one cheap transform per moving square; the loop sleeps when nothing moves ---------- */
let U=1,raf=0,lastT=0,slow=0,seen=0,R={left:0,top:0},web=null;
function render(p){
  const k=p.x.toFixed(3)+'|'+p.y.toFixed(3)+'|'+p.rot.toFixed(2)+'|'+p.s.toFixed(3);
  if(k===p.last)return;p.last=k;
  p.el.style.transform='translate('+((p.x+OX)*U).toFixed(2)+'px,'+((p.y+OY)*U).toFixed(2)+'px) rotate('+p.rot.toFixed(2)+'deg) scale('+p.s.toFixed(4)+')';
}
function measure(){R=stage.getBoundingClientRect();U=R.width/UW;for(const p of pieces){p.last='';render(p)}}
function wake(){if(!raf){lastT=0;raf=requestAnimationFrame(tick)}}
function tick(ts){
  raf=0;let moving=false;
  // watchdog: if frames keep taking more than ~35 ms, quietly drop the sparkles and wobble
  if(lastT&&!lite){const dt=ts-lastT;seen++;if(dt>35)slow++;if(seen>=24){if(slow>=9){lite=true;stage.classList.add('lite')}seen=0;slow=0}}
  lastT=ts;
  for(const p of pieces){
    const dx=p.tx-p.x,dy=p.ty-p.y,dr=p.trot-p.rot,ds=p.ts-p.s;
    if(Math.abs(dx)+Math.abs(dy)+Math.abs(dr)+Math.abs(ds)>.002){
      const k=p.dragging?.4:.3;
      p.x+=dx*k;p.y+=dy*k;p.rot+=dr*k;p.s+=ds*k;moving=true;
      if(!p.mv){p.mv=1;p.el.classList.add('mv')}
    }else{
      p.x=p.tx;p.y=p.ty;p.rot=p.trot;p.s=p.ts;
      if(p.mv){p.mv=0;p.el.classList.remove('mv')}
    }
    render(p);
  }
  if(web){
    const wp=web.p,ws=web.s,dx=wp.x-ws.c.x,dy=wp.y-ws.c.y,L=Math.hypot(dx,dy);
    web.el.style.width=(L*U).toFixed(1)+'px';
    web.el.style.transform='rotate('+Math.atan2(dy,dx).toFixed(4)+'rad)';
    if(web.go&&L<.07){const w=web;web=null;w.el.classList.add('fade');setTimeout(()=>w.el.remove(),300)}
  }
  if(cur)placeTag();
  if(moving||cur||web){raf=requestAnimationFrame(tick)}else{lastT=0}
}
if(window.ResizeObserver)new ResizeObserver(measure).observe(stage);else window.addEventListener('resize',measure);
measure();

/* ---------- the name tag (only while a square is held) ---------- */
function placeTag(){
  const x=Math.min(UW-1.4,Math.max(1.4,cur.x+OX)),y=Math.max(1.3,cur.y+OY-.85);
  tag.style.setProperty('--cx',x.toFixed(3));tag.style.setProperty('--cy',y.toFixed(3));
}

/* ---------- sound (the audio engine is created at start-up and unlocked on the very first tap) ---------- */
let ac=null,muted=false,warmed=false;
function audio(){
  if(!ac){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return null;
    try{ac=new AC({latencyHint:'interactive'})}catch(e){try{ac=new AC()}catch(_){return null}}
  }
  if(ac.state!=='running')ac.resume().catch(()=>{});
  return ac;
}
function unlock(){
  const a=audio();if(!a||warmed)return;
  warmed=true;
  try{const s=a.createBufferSource();s.buffer=a.createBuffer(1,1,22050);s.connect(a.destination);s.start(0)}catch(_){}
}
['pointerdown','touchend','click','keydown'].forEach(ev=>window.addEventListener(ev,unlock,{capture:true,passive:true}));
audio();
function pop(f0,f1,dur=.14,vol=.35){
  if(muted)return;
  const a=audio();if(!a)return;
  const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type='sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02);
}
const popOut=()=>pop(900,260,.15);                         // a square comes out
const popPut=(n=0)=>pop(380+n*14,900+n*22,.13);            // a square goes in
function chime(){[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>pop(f,f*1.01,.35,.25),i*120))}

/* ---------- wobble + sparkles ---------- */
function wobble(p){
  if(lite||!p.inner.animate)return;
  p.inner.style.willChange='transform';
  const an=p.inner.animate([
    {transform:'scale(1,1) rotate(0deg)'},
    {transform:'scale(1.3,.7) rotate(-6deg)',offset:.2},
    {transform:'scale(.82,1.2) rotate(6deg)',offset:.4},
    {transform:'scale(1.12,.92) rotate(-4deg)',offset:.62},
    {transform:'scale(.96,1.05) rotate(2deg)',offset:.82},
    {transform:'scale(1,1) rotate(0deg)'}
  ],{duration:520,easing:'ease-out'});
  an.onfinish=an.oncancel=()=>{p.inner.style.willChange=''};
}
function burst(x,y,col){
  if(lite)return;
  const g=document.createElement('div');g.className='burst';
  g.style.setProperty('--cx',x+OX);g.style.setProperty('--cy',y+OY);g.style.setProperty('--bc',col);
  layer.appendChild(g);setTimeout(()=>g.remove(),600);
}

/* ---------- places, boxes and free placement ---------- */
const EV=[-.6,-.8],NV=[.8,-.6];
function boxAt(x,y){                          // which of the three boxes (if any) is this point inside?
  if(x>=0&&x<=3&&y>=0&&y<=3)return 'a';
  if(x>=-4&&x<=0&&y>=-4&&y<=0)return 'b';
  const dx=x-3,i=dx*EV[0]+y*EV[1],j=dx*NV[0]+y*NV[1];
  return(i>=0&&i<=5&&j>=0&&j<=5)?'h':null;
}
function setOut(p,on){if(p.out===on)return;p.out=on;p.el.classList.toggle('out',on)}
function release(p){
  const s=p.slot;if(!s)return;
  s.piece=null;p.slot=null;
  if(s.box==='h')s.el.classList.remove('full');
}
function occupy(p,s){
  release(p);s.piece=p;p.slot=s;setOut(p,false);
  const h=s.box==='h';
  p.tx=s.c.x;p.ty=s.c.y;p.trot=h?HROT:0;p.ts=h?PLACED:1;
}
function place(p,c,n){                        // into the big square: sparkles, sound, counters
  popPut(n||0);                               // sound first, before any drawing work
  occupy(p,c);c.el.classList.add('full');
  stage.classList.add('started');
  wobble(p);burst(c.c.x,c.c.y,p.kind==='a'?'#fcd34d':'#38bdf8');
  updateCount();wake();
}
function settle(p,s){popPut();occupy(p,s);wobble(p);wake()}           // into one of the two small boxes
function floatAt(p,x,y){release(p);setOut(p,false);p.tx=x;p.ty=y;p.trot=0;p.ts=1;popPut();wobble(p);wake()}
function cancelWeb(){
  if(!web)return;
  const w=web;web=null;w.el.remove();
  if(w.s.piece===w.p&&w.p.slot!==w.s)w.s.piece=null;          // give back the reserved place
}
function webBack(p){                          // Azad shoots a web at his box and pulls himself back in
  let s=(p.homeSlot&&!p.homeSlot.piece)?p.homeSlot:null;
  if(!s)s=legSlots.filter(q=>q.box==='a'&&!q.piece).sort((m,n)=>Math.hypot(m.c.x-p.tx,m.c.y-p.ty)-Math.hypot(n.c.x-p.tx,n.c.y-p.ty))[0]||null;
  if(!s){floatAt(p,p.tx,p.ty);return}
  s.piece=p;                                  // reserve it
  const el=document.createElement('div');el.className='web';
  el.style.setProperty('--cx',s.c.x+OX);el.style.setProperty('--cy',s.c.y+OY);
  layer.appendChild(el);
  const w=web={el,p,s,go:false};
  setTimeout(()=>{if(web===w){w.go=true;pop(1500,350,.14,.3);occupy(p,s);wake()}},230);   // thwip! swing back
  pop(1100,500,.1,.25);wake();
}
function throwOut(p,x,y){                     // dropped outside the boxes
  release(p);p.tx=x;p.ty=y;p.trot=0;p.ts=1;
  if(plain){popPut();wobble(p);wake();return}
  if(p.who==='azad'){webBack(p);return}
  setOut(p,true);
  if(p.who==='somia'){pop(780,520,.18,.3);setTimeout(()=>pop(700,420,.22,.3),170)}      // a furious grumble
  else pop(520,170,.5,.3);                    // a sad little wail
  wobble(p);wake();
}

/* ---------- drag & drop ---------- */
let Z=10,lite=false,plain=false,cur=null,activeId=null,off={x:0,y:0},cand=null,won=false,busy=false,runId=0;
function toUnits(e){                      // uses the cached stage position: no layout work while dragging
  return{x:(e.clientX-R.left)/U-OX,y:(e.clientY-R.top)/U-OY};
}
function down(e,p){
  if(cur||busy||(e.button>0))return;
  e.preventDefault();popOut();
  R=stage.getBoundingClientRect();
  cancelWeb();
  cur=p;activeId=e.pointerId;p.dragging=true;p.el.classList.add('drag');p.el.classList.remove('idle');
  try{p.el.setPointerCapture(e.pointerId)}catch(_){}          // keep following the finger outside the window
  p.el.style.zIndex=++Z;                                      // bring to front
  const u=toUnits(e);off={x:p.x-u.x,y:p.y-u.y};
  p.ts=LIFT;
  const wasBig=p.slot&&p.slot.box==='h';
  release(p);setOut(p,false);
  if(wasBig)updateCount();
  if(!plain){tag.textContent=p.name;placeTag();tag.classList.add('show')}
  if(p.who==='somia'&&!plain)setLang(true);
  wobble(p);
  clearWin();wake();
}
function nearestFree(x,y){
  let best=null,bd=1.15;
  for(const s of slots){if(s.piece)continue;const d=Math.hypot(s.c.x-x,s.c.y-y);if(d<bd){bd=d;best=s}}
  return best;
}
function move(e){
  if(!cur||e.pointerId!==activeId)return;
  const u=toUnits(e);
  const x=Math.min(MAXX,Math.max(MINX,u.x+off.x)),y=Math.min(MAXY,Math.max(MINY,u.y+off.y));
  const c=nearestFree(x,y);
  if(cand&&cand!==c)cand.el.classList.remove('hot');
  cand=c;
  if(c){c.el.classList.add('hot');cur.tx=c.c.x;cur.ty=c.c.y;const h=c.box==='h';cur.trot=h?HROT:0;cur.ts=h?PLACED:LIFT}   // magnet
  else{cur.tx=x;cur.ty=y;cur.trot=0;cur.ts=LIFT}
  wake();
}
function up(e){
  if(!cur||e.pointerId!==activeId)return;
  const p=cur,c=cand;cur=null;activeId=null;cand=null;p.dragging=false;p.el.classList.remove('drag');tag.classList.remove('show');
  if(p.who==='somia')setLang(false);
  if(c){c.el.classList.remove('hot');if(c.box==='h')place(p,c,0);else settle(p,c);return}
  const x=p.tx,y=p.ty,bx=boxAt(x,y);
  if(bx){                                     // inside a box: sit in its nearest free place (or stay where dropped)
    const free=slots.filter(s=>s.box===bx&&!s.piece).sort((m,n)=>Math.hypot(m.c.x-x,m.c.y-y)-Math.hypot(n.c.x-x,n.c.y-y));
    if(free.length){if(bx==='h')place(p,free[0],0);else settle(p,free[0])}
    else floatAt(p,x,y);
  }else throwOut(p,x,y);                      // outside every box: out you go
}
pieces.forEach(p=>p.el.addEventListener('pointerdown',e=>down(e,p)));
window.addEventListener('pointermove',move);
window.addEventListener('pointerup',up);
window.addEventListener('pointercancel',up);
window.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- counters / win ---------- */
function updateCount(){
  let a=0,b=0;
  for(const c of cells)if(c.piece){c.piece.kind==='a'?a++:b++}
  const t=a+b;
  $('ca').textContent=N(a);$('cb').textContent=N(b);$('ct').textContent=N(t);
  $('ea').textContent=N(a);$('eb').textContent=N(b);$('ec').textContent=N(t);
  $('ba').style.transform='scaleX('+(a/9)+')';$('bb').style.transform='scaleX('+(b/16)+')';$('bt').style.transform='scaleX('+(t/25)+')';
  syncAuto();
  if(t===25&&!won){won=true;setTimeout(()=>{if(won)celebrate()},450)}
}
function syncAuto(){
  let t=0;for(const c of cells)if(c.piece)t++;
  $('auto').disabled=busy||t===25;
}
function clearWin(){won=false;$('result').classList.remove('won')}
function celebrate(){
  $('result').classList.add('won');chime();
  for(const p of pieces)setTimeout(()=>wobble(p),Math.random()*500);
}

/* ---------- Auto fill: only when the button is pressed ---------- */
function autofill(){
  if(busy||cur)return;
  audio();
  cancelWeb();
  const todo=pieces.filter(p=>!(p.slot&&p.slot.box==='h'));
  const free=cells.filter(c=>!c.piece).sort((a,b)=>(a.j-b.j)||(a.i-b.i));   // the row next to the triangle first
  if(!todo.length)return;
  busy=true;syncAuto();clearWin();
  const my=++runId;let n=0;
  (function step(){
    if(my!==runId)return;
    if(n>=todo.length){busy=false;syncAuto();return}
    const p=todo[n],c=free[n];
    p.el.classList.remove('idle');
    place(p,c,n);n++;
    setTimeout(step,150);
  })();
}

/* ---------- reset ---------- */
function reset(){
  audio();runId++;busy=false;clearWin();stage.classList.remove('started');cancelWeb();setLang(false);
  if(cur){cur.dragging=false;cur.el.classList.remove('drag');cur=null;activeId=null;cand=null}
  tag.classList.remove('show');
  slots.forEach(s=>{s.piece=null;s.el.classList.remove('hot','full')});
  pieces.forEach((p,i)=>{
    p.slot=null;setOut(p,false);occupy(p,p.homeSlot);p.el.classList.add('idle');
    setTimeout(()=>{popPut(i%8);wobble(p)},i*25);
  });
  updateCount();wake();
}
$('auto').addEventListener('click',autofill);
$('reset').addEventListener('click',reset);
const FACE_ON='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01"/><path d="M15 9h.01"/></svg>',FACE_OFF='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01"/><path d="M15 9h.01"/><path d="M4 4l16 16"/></svg>';
$('pers').addEventListener('click',()=>{
  plain=!plain;stage.classList.toggle('plain',plain);tag.classList.remove('show');
  $('pers').innerHTML=plain?FACE_OFF:FACE_ON;$('pers').setAttribute('aria-pressed',String(!plain));
  popPut();
});
$('mute').addEventListener('click',()=>{
  muted=!muted;audio();
  $('mute').innerHTML=muted?SPK_OFF:SPK_ON;$('mute').setAttribute('aria-pressed',String(muted));
  if(!muted)popPut();
});
})();
</script>
</body>
</html>
