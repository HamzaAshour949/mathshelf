  <script>
    // Runs before the first paint, so the theme and the reading direction never flash.
    try {
      var d = document.documentElement, s = localStorage.getItem('mathshelf.theme');
      if (s === 'light' || s === 'dark') d.setAttribute('data-theme', s);
      if (location.hash.indexOf('#/ar') === 0) { d.lang = 'ar'; d.dir = 'rtl'; }
      var m = /#(?:\/ar)?\/year\/(\d+)/.exec(location.hash); if (m) d.setAttribute('data-year', m[1]);
    } catch (e) {}
  </script>
