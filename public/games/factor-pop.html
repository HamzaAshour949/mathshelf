<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">

<meta property="og:description" content="Factor Pop, a Year 8 maths game by Mr. Hamza: grow the factor tree of each term, then drag the common factors out.">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='8' width='48' height='48' rx='13' fill='%23e8ecff' stroke='%234f46e5' stroke-width='6'/%3E%3Ccircle cx='24' cy='27' r='4.5' fill='%232b1a4d'/%3E%3Ccircle cx='40' cy='27' r='4.5' fill='%232b1a4d'/%3E%3Cpath d='M22 40q10 9 20 0' fill='none' stroke='%232b1a4d' stroke-width='4.5' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Factorising expressions</title>
<style>
  /* the whole game always fits the screen and nothing scrolls, at any size */
  :root{
    --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --accent:#4f46e5; --accent-d:#4338ca; --bg:#f4f5fa;
    --pen:#1a47d1; --pencil:#4d4d4d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
  body{
    position:fixed;inset:0;
    display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;
    font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--bg);
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  [hidden]{display:none!important}
  header{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px 12px;padding:10px 12px 2px;min-width:0}
  h1{margin:0;flex:none;white-space:nowrap;display:flex;align-items:center;gap:8px;font-size:clamp(17px,4.8vw,26px);font-weight:700;letter-spacing:-.015em;line-height:1.1}
  h1 svg{width:1.2em;height:1.2em;flex:none}
  #ramp{min-width:0;display:flex;align-items:flex-end;gap:4px;height:clamp(14px,3.4vh,24px);max-width:280px;width:100%;margin:0 auto;overflow:hidden}
  .rb{appearance:none;border:0;padding:0;margin:0;flex:1;min-width:0;border-radius:4px 4px 3px 3px;background:#dfe2ea;height:calc(22% + var(--i) * 7.5%);cursor:default;transform-origin:50% 100%;transition:background .25s}
  .rb.done{background:var(--accent);cursor:pointer}
  .rb.cur{box-shadow:inset 0 0 0 2px #1e1b4b}
  .hb{flex:none;display:flex;gap:8px}
  .ib{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;min-height:40px;min-width:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font:inherit;font-weight:600;font-size:clamp(13px,3.6vw,15px);cursor:pointer;position:relative;touch-action:manipulation;transition:background .15s,transform .12s cubic-bezier(.2,.9,.3,1)}
  .ib:hover{background:#f9fafb}
  .ib:active{transform:scale(.95)}
  .ib:focus-visible,.bt:focus-visible{outline:3px solid #c7d2fe;outline-offset:2px}
  .ib svg{width:19px;height:19px;flex:none}
  .ib.off .wave{display:none}
  .ib.nb{background:#f59e0b;border-color:#d97706;color:#2b1a02;font-weight:700}
  .ib.nb:hover{background:#fbbf24}
  .ib.nb.pulse{animation:nbp 1.7s ease-out infinite}
  @keyframes nbp{0%{box-shadow:0 0 0 0 rgba(245,158,11,.65)}70%{box-shadow:0 0 0 12px rgba(245,158,11,0)}100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}}
  main{position:relative;min-height:0;display:grid;place-items:center;padding:6px 10px}
  #stage{position:relative;width:100%;max-width:1100px;height:min(100%,calc(100vw * 1.3));border-radius:18px;background:#fff;box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(16,24,40,.05),0 12px 32px rgba(16,24,40,.06);overflow:hidden}
  /* the floating numbers and letters live in the page background, behind the white work space and its buttons */
  #deco{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
  #deco i{position:absolute;left:0;top:0;font-style:normal;font-weight:700;line-height:1;white-space:nowrap;will-change:transform;font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #deco em{font-family:"Times New Roman","STIX Two Text",Georgia,serif;font-style:italic}
  #sv{position:absolute;z-index:1;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:default}
  #hard{position:absolute;z-index:3;display:inline-flex;align-items:center;gap:5px;height:clamp(21px,3.6vh,27px);padding:0 10px 0 8px;border-radius:999px;background:#fff1e6;border:1.5px solid #f97316;color:#c2410c;font-weight:800;font-size:clamp(12px,3.3vw,15px);pointer-events:none;animation:hardin .55s cubic-bezier(.2,1.4,.4,1)}
  #hard svg{width:1.15em;height:1.15em;flex:none}
  @keyframes hardin{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
  #sv.over{cursor:pointer}
  #sv.grab{cursor:grab}
  footer{display:flex;justify-content:center;gap:8px;padding:6px 12px 4px}
  .bt{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;height:clamp(42px,7vh,48px);padding:0 clamp(12px,3.6vw,20px);font:inherit;font-weight:600;font-size:clamp(14px,3.9vw,15px);white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;touch-action:manipulation;transition:background .15s,transform .12s cubic-bezier(.2,.9,.3,1),box-shadow .15s}
  .bt:hover{background:#f9fafb}
  .bt:active{transform:scale(.96)}
  .bt svg{width:18px;height:18px;flex:none}
  .bt.go{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(79,70,229,.35)}
  .bt.go:hover{background:var(--accent-d)}
  .bt:disabled{background:#eceef3;border-color:#eceef3;color:#9ca3af;box-shadow:none;cursor:default;transform:none}
  .bt.ready{animation:rdy 1.6s ease-in-out infinite}
  @keyframes rdy{50%{transform:scale(1.045)}}
  #split{min-width:min(30vw,112px)}
  #next .lg,#next .nx{display:none}
  #next.done .fl{display:none}
  #next.done .nx{display:inline}
  @media (min-width:560px){#next:not(.done) .lg{display:inline}#next:not(.done) .sm{display:none}}
  .credit{text-align:center;font-size:11px;line-height:1.35;color:#9ca3af;padding:0 8px 6px}
  .credit b{color:#4b5563;font-weight:600}
  /* the keypad: it slides over the footer while a factor is typed into a "?" card */
  #kp{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,520px);z-index:15;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -1px 0 var(--line),0 -10px 28px rgba(16,24,40,.14);padding:8px 10px calc(10px + env(safe-area-inset-bottom));touch-action:manipulation;will-change:transform}
  #kp.in{animation:kpin .26s cubic-bezier(.2,.9,.25,1)}
  @keyframes kpin{from{transform:translate(-50%,34px);opacity:.2}to{transform:translate(-50%,0);opacity:1}}
  .kph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 4px 8px;font-weight:600;font-size:15px;color:var(--muted)}
  .kph b{color:var(--ink);font-size:17px;font-family:"Times New Roman","STIX Two Text",Georgia,serif;font-weight:700}
  .kgap{flex:1}
  .kauto{appearance:none;border:1px solid #c7d2fe;background:#eef2ff;color:#3730a3;border-radius:10px;height:34px;padding:0 12px;font:inherit;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;touch-action:manipulation;transition:transform .12s cubic-bezier(.2,.9,.3,1),background .15s}
  .kauto svg{width:16px;height:16px}
  .kauto:active{background:#e0e7ff;transform:scale(.95)}
  .kx{appearance:none;border:0;background:#f3f4f6;color:#4b5563;width:34px;height:34px;border-radius:10px;font:inherit;font-size:16px;cursor:pointer}
  #kpk{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
  .kb{appearance:none;border:1px solid var(--line);background:#f9fafb;color:var(--ink);border-radius:11px;height:clamp(40px,6.4vh,50px);font:inherit;font-weight:700;font-size:19px;cursor:pointer;touch-action:manipulation;padding:0;transition:transform .1s cubic-bezier(.2,.9,.3,1),background .12s}
  .kb:active{background:#e0e7ff;transform:scale(.94)}
  .kb.ltr{font-family:"Times New Roman","STIX Two Text",Georgia,serif;font-style:italic;font-size:23px;background:#eef2ff;border-color:#c7d2fe;color:#3730a3}
  .kb.ok{background:var(--accent);border-color:var(--accent);color:#fff}
  /* the hand that points at the Finished button: it taps down on it, with waves from the fingertip */
  #fh{position:fixed;z-index:12;width:0;height:0;pointer-events:none}
  .fhb{position:absolute;bottom:76px;left:0;width:max-content;max-width:min(84vw,300px);transform:translateX(calc(-50% + var(--sx,0px)));background:#fff;border:2.5px solid #4f46e5;border-radius:16px;padding:8px 14px;font-weight:700;font-size:clamp(13px,3.6vw,16px);line-height:1.25;color:#2b1a4d;text-align:center;box-shadow:0 6px 18px rgba(79,70,229,.22);animation:fhb .45s cubic-bezier(.2,1.3,.4,1)}
  .fhb::after{content:'';position:absolute;top:100%;left:calc(50% - var(--sx,0px));width:13px;height:13px;background:#fff;border-right:2.5px solid #4f46e5;border-bottom:2.5px solid #4f46e5;transform:translate(-50%,-8px) rotate(45deg)}
  @keyframes fhb{0%{opacity:0;transform:translateX(calc(-50% + var(--sx,0px))) scale(.7)}100%{opacity:1;transform:translateX(calc(-50% + var(--sx,0px))) scale(1)}}
  .fhw{animation:fhp 1.4s ease-in-out infinite}
  @keyframes fhp{0%,100%{transform:translateY(-9px)}50%{transform:translateY(2px)}}
  .fhr{fill:none;stroke:#4f46e5;stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center;animation:fhr 1.4s ease-out infinite}
  @keyframes fhr{0%{transform:scale(.3);opacity:.8}100%{transform:scale(3.4);opacity:0}}
  /* the notebook page: a real A4 page (1 : 1.414, the shape of every school exercise book), blue pen, grey pencil for the answers */
  #sheet{position:fixed;inset:0;z-index:20;background:rgba(17,24,39,.58);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom))}
  #paperbox{flex:none;display:flex;align-items:center;justify-content:center}
  .paper{--mm:1.7px;--L:calc(var(--mm) * 8);--fs:7.4;position:relative;flex:none;overflow:hidden;color:var(--pen);border-radius:calc(var(--mm) * 1.4);background-color:#fffffe;
    background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--L) - 1px),#dce5f6 calc(var(--L) - 1px),#dce5f6 var(--L));
    box-shadow:0 22px 60px rgba(0,0,0,.5);padding:calc(var(--L) * 2) calc(var(--mm) * 15) 0;
    font-family:"Bradley Hand","Segoe Print","Segoe Script","Chalkboard SE","Marker Felt","Comic Sans MS",ui-rounded,system-ui,sans-serif;font-weight:600;font-size:calc(var(--mm) * var(--fs));line-height:1}
  .row{height:calc(var(--L) * 2);display:flex;align-items:flex-end;white-space:nowrap;padding-bottom:calc(var(--mm) * 1.2)}
  .row .in{display:block;white-space:pre}
  .row.hd{justify-content:space-between}
  .row.ttl{justify-content:center}
  .row.ttl span{border-bottom:calc(var(--mm) * .6) solid var(--pen);padding:0 calc(var(--mm) * 3) calc(var(--mm) * .3)}
  .row.q{font-weight:800}
  .row.tight{height:var(--L)}
  .tc{display:inline-block;width:calc(var(--mm) * 17);text-align:right}
  .eq{display:inline-block;width:calc(var(--mm) * 8);text-align:center}
  .cx{display:inline-block;width:calc(var(--mm) * 6);text-align:center}
  .bl.c{margin:0}
  .gr{color:#15803d;font-weight:800}
  .nsm{font-size:.78em;font-weight:600}
  .opx{display:inline-block;margin:0 calc(var(--mm) * 2)}
  .lbl{margin-right:calc(var(--mm) * 1.5)}
  .bl{display:inline-block;position:relative;height:calc(var(--mm) * 5.6);border-bottom:calc(var(--mm) * .4) solid var(--pen);margin:0 calc(var(--mm) * 1.3);vertical-align:bottom}
  .bl .a{position:absolute;left:0;right:0;bottom:calc(var(--mm) * .6);text-align:center;color:var(--pencil);font-weight:800;opacity:0;white-space:nowrap;text-shadow:0 0 .4px rgba(0,0,0,.35)}
  .paper.ans .bl .a{opacity:1}
  .paper.ans .bl{border-bottom-color:rgba(26,71,209,.4)}
  .op{margin:0 calc(var(--mm) * .6)}
  .pi{font-family:"Times New Roman","STIX Two Text",Georgia,serif;font-style:italic;font-weight:700}
  .sheetbar{flex:none;display:flex;gap:10px}
  .tcol{display:flex;flex-direction:column;align-items:center}
  .tsvg{display:block;opacity:0;margin-top:calc(var(--mm) * .6);font-family:inherit;overflow:visible}
  .paper.ans .tsvg{opacity:1}
  .tarea{height:calc(var(--L) * 8);display:flex;justify-content:space-around;align-items:flex-start;padding-top:calc(var(--mm) * 1.2)}
  .troot{min-width:calc(var(--mm) * 24);text-align:center;border:calc(var(--mm) * .5) solid var(--pen);border-radius:calc(var(--mm) * 3);padding:calc(var(--mm) * 1.6) calc(var(--mm) * 3);font-weight:800}
  /* the win card */
  #win{position:fixed;inset:0;z-index:18;display:grid;place-items:center;background:rgba(17,24,39,.45);padding:12px}
  .wcard{background:#fff;border-radius:20px;padding:18px 20px;box-shadow:0 0 0 1px var(--line),0 18px 44px rgba(16,24,40,.25);text-align:center;max-width:min(92vw,380px);display:grid;gap:10px}
  .wcard h2{margin:0;font-size:clamp(20px,6vw,26px);font-weight:700}
  .wcard p{margin:0;color:var(--muted);font-size:clamp(14px,3.8vw,16px);line-height:1.35}
  .wrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  #cv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:19}
  .nojs{padding:20px;text-align:center}
  @media (max-width:470px){#ramp{grid-column:1/-1;grid-row:2;max-width:none;height:clamp(10px,2vh,16px)}}
  @media (max-width:470px) and (max-height:420px){#ramp{display:none}}
  @media (max-width:360px){.bt svg{display:none}.bt{padding:0 11px}#again svg{display:block}}
  @media (max-width:345px){.ib{padding:0 9px;gap:5px;font-size:13px}.ib svg{width:17px;height:17px}h1{font-size:17px}header{gap:6px 8px;padding:8px 10px 2px}#ramp{gap:3px}}
  @media (max-width:300px){#ramp{display:none}header{grid-template-columns:auto 1fr auto}#again span{display:none}}
  @media (max-width:270px){h1{font-size:15px}h1 svg{display:none}.ib{min-width:36px;min-height:36px}.bt{padding:0 9px}footer{gap:6px}}
  @media (max-height:520px){.credit{display:none}header{padding-top:6px}}
  @media (max-height:420px){header{padding-top:4px}footer{padding:3px 12px 6px}main{padding:2px 8px}}
  @media (prefers-reduced-motion:reduce){#hard{animation:none}.ib.nb.pulse,.bt.ready{animation:none}#kp.in{animation:none}.fhw,.fhr{animation:none}.fhr{opacity:.5}}
</style>
</head>
<body>
<div id="deco" aria-hidden="true"></div>
<header>
  <h1><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="8" width="48" height="48" rx="13" fill="#e8ecff" stroke="#4f46e5" stroke-width="6"/><circle cx="24" cy="27" r="4.5" fill="#2b1a4d"/><circle cx="40" cy="27" r="4.5" fill="#2b1a4d"/><path d="M22 40q10 9 20 0" fill="none" stroke="#2b1a4d" stroke-width="4.5" stroke-linecap="round"/></svg>Factor Pop</h1>
  <div id="ramp" aria-label="The stages"></div>
  <div class="hb">
    <button class="ib nb pulse" id="nbtn" type="button" aria-label="Notebook page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6z"/><path d="M6 3v18M10 8h6M10 12h6M10 16h4"/></svg><span>Notebook</span></button>
    <button class="ib" id="mute" type="button" aria-label="Sound on or off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="wave" d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg></button>
  </div>
</header>
<main><div id="stage"><svg id="sv" xmlns="http://www.w3.org/2000/svg" aria-label="Play area"></svg><div id="hard" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5L2.8 20h18.4z"/><path d="M12 10v4.5M12 17.4v.1"/></svg>Hard</div></div></main>
<footer>
  <button class="bt" id="again" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 108-8H8"/><path d="M10 1L7 4l3 3"/></svg><span>Again</span></button>
  <button class="bt" id="split" type="button" aria-label="Show me the trees"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v4M12 7l-6 6M12 7l6 6M6 13v4M18 13v4"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="19" r="2"/></svg><span>Show me</span></button>
  <button class="bt" id="next" type="button" aria-label="Finished factorising"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span class="fl"><span class="sm">Finished</span><span class="lg">Finished factorising</span></span><span class="nx" id="nx">Next</span></button>
</footer>
<div class="credit">Made by: <b>Mr. Hamza Ashour</b></div>
<div id="fh" hidden aria-hidden="true"><div class="fhb"></div><svg width="1" height="1" style="position:absolute;left:0;top:0;overflow:visible"><circle class="fhr" r="14"/><circle class="fhr" r="14" style="animation-delay:.7s"/><g class="fhw"><g transform="rotate(168) scale(44)"><path d="M-0.11 0.12 A0.11 0.11 0 0 1 0.11 0.12 L0.11 0.46 A0.1 0.1 0 0 1 0.3 0.47 A0.09 0.09 0 0 1 0.47 0.52 A0.085 0.085 0 0 1 0.63 0.58 L0.63 0.86 Q0.61 1.14 0.4 1.2 L0 1.2 Q-0.1 1.06 -0.3 0.78 Q-0.42 0.6 -0.29 0.54 Q-0.18 0.52 -0.11 0.7 Z" fill="#fff" stroke="#3730a3" stroke-width="0.07" stroke-linejoin="round"/><path d="M0.3 0.58 L0.3 0.85 M0.47 0.62 L0.47 0.85" fill="none" stroke="#a5b4fc" stroke-width="0.05" stroke-linecap="round"/></g></g></svg></div>
<div id="kp" hidden role="group" aria-label="Type a factor">
  <div class="kph"><span>Factor of <b id="kpt"></b></span><span class="kgap"></span><button class="kauto" id="kpa" type="button" aria-label="Split this card for me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v4M12 7l-6 6M12 7l6 6M6 13v4M18 13v4"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="19" r="2"/></svg>Fill for me</button><button class="kx" id="kpx" type="button" aria-label="Close the keypad">&#10005;</button></div>
  <div id="kpk"></div>
</div>
<div id="sheet" hidden role="dialog" aria-modal="true" aria-label="Notebook page">
  <div id="paperbox"><div class="paper" id="paper"></div></div>
  <div class="sheetbar"><button class="bt" id="sans" type="button">Show answers</button><button class="bt go" id="sclose" type="button">Close</button></div>
</div>
