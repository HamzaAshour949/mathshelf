<!doctype html>

<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="author" content="Made by: Mr. Hamza Ashour">
<meta name="description" content="Factor Pop: a maths game about factorising. Split each term into its factors, then help the angry ones out of the box.">
<meta name="theme-color" content="#f4f5fa">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='8' width='48' height='48' rx='13' fill='%23e8ecff' stroke='%234f46e5' stroke-width='6'/%3E%3Ccircle cx='24' cy='27' r='4.5' fill='%232b1a4d'/%3E%3Ccircle cx='40' cy='27' r='4.5' fill='%232b1a4d'/%3E%3Cpath d='M22 40q10 9 20 0' fill='none' stroke='%232b1a4d' stroke-width='4.5' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Factor Pop</title>
<style>
  /* the whole game always fits the screen and nothing scrolls, at any size */
  :root{
    --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --accent:#4f46e5; --accent-d:#4338ca; --bg:#f4f5fa;
    --pen:#1a47d1; --pencil:#4d4d4d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
  body{
    position:fixed;inset:0;
    display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;
    font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--bg);
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  [hidden]{display:none!important}
  header{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px 12px;padding:10px 12px 2px;min-width:0}
  h1{margin:0;flex:none;white-space:nowrap;display:flex;align-items:center;gap:8px;font-size:clamp(17px,4.8vw,26px);font-weight:700;letter-spacing:-.015em;line-height:1.1}
  h1 svg{width:1.2em;height:1.2em;flex:none}
  #ramp{min-width:0;display:flex;align-items:flex-end;gap:4px;height:clamp(14px,3.4vh,24px);max-width:280px;width:100%;margin:0 auto;overflow:hidden}
  .rb{appearance:none;border:0;padding:0;margin:0;flex:1;min-width:0;border-radius:4px 4px 3px 3px;background:#dfe2ea;height:calc(26% + var(--i) * 10%);cursor:default;transform-origin:50% 100%;transition:background .25s}
  .rb.done{background:var(--accent);cursor:pointer}
  .rb.cur{box-shadow:inset 0 0 0 2px #1e1b4b}
  .hb{flex:none;display:flex;gap:8px}
  .ib{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;min-height:40px;min-width:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font:inherit;font-weight:600;font-size:clamp(13px,3.6vw,15px);cursor:pointer;position:relative;touch-action:manipulation}
  .ib:hover{background:#f9fafb}
  .ib:active{transform:scale(.96)}
  .ib:focus-visible,.bt:focus-visible{outline:3px solid #c7d2fe;outline-offset:2px}
  .ib svg{width:19px;height:19px;flex:none}
  .ib.off .wave{display:none}
  .ib .dot{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:#ec4899;border:2px solid var(--bg);animation:dotp 1.4s ease-in-out infinite}
  @keyframes dotp{50%{transform:scale(1.35)}}
  main{position:relative;min-height:0;display:grid;place-items:center;padding:6px 10px}
  #stage{position:relative;width:100%;max-width:1100px;height:min(100%,calc(100vw * 1.3));border-radius:18px;background:#fff;box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(16,24,40,.05),0 12px 32px rgba(16,24,40,.06);overflow:hidden}
  #sv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:default}
  #sv.over{cursor:grab}
  footer{display:flex;justify-content:center;gap:8px;padding:6px 12px 4px}
  .bt{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;height:clamp(42px,7vh,48px);padding:0 clamp(12px,3.6vw,20px);font:inherit;font-weight:600;font-size:clamp(14px,3.9vw,15px);white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;touch-action:manipulation;transition:background .15s,transform .08s,box-shadow .15s}
  .bt:hover{background:#f9fafb}
  .bt:active{transform:scale(.97)}
  .bt svg{width:18px;height:18px;flex:none}
  .bt.go{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(79,70,229,.35)}
  .bt.go:hover{background:var(--accent-d)}
  .bt:disabled{background:#eceef3;border-color:#eceef3;color:#9ca3af;box-shadow:none;cursor:default;transform:none}
  .bt.ready{animation:rdy 1.6s ease-in-out infinite}
  @keyframes rdy{50%{transform:scale(1.045)}}
  #split{min-width:min(30vw,112px)}
  #split .j{display:none}
  #split.joined .s{display:none}
  #split.joined .j{display:inline}
  #next .lg,#next .nx{display:none}
  #next.done .fl{display:none}
  #next.done .nx{display:inline}
  @media (min-width:560px){#next:not(.done) .lg{display:inline}#next:not(.done) .sm{display:none}}
  .credit{text-align:center;font-size:11px;line-height:1.35;color:#9ca3af;padding:0 8px 6px}
  .credit b{color:#4b5563;font-weight:600}
  /* the notebook page: a real A4 page (1 : 1.414, the shape of every school exercise book), blue pen, grey pencil for the answers */
  #sheet{position:fixed;inset:0;z-index:20;background:rgba(17,24,39,.58);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom))}
  #paperbox{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
  .paper{--mm:1.7px;--L:calc(var(--mm) * 8);--fs:7.4;position:relative;flex:none;overflow:hidden;color:var(--pen);border-radius:calc(var(--mm) * 1.4);background-color:#fffffe;
    background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--L) - 1px),#dce5f6 calc(var(--L) - 1px),#dce5f6 var(--L));
    box-shadow:0 22px 60px rgba(0,0,0,.5);padding:calc(var(--L) * 2) calc(var(--mm) * 15) 0;
    font-family:"Bradley Hand","Segoe Print","Segoe Script","Chalkboard SE","Marker Felt","Comic Sans MS",ui-rounded,system-ui,sans-serif;font-weight:600;font-size:calc(var(--mm) * var(--fs));line-height:1}
  .row{height:calc(var(--L) * 2);display:flex;align-items:flex-end;white-space:nowrap;padding-bottom:calc(var(--mm) * 1.2)}
  .row .in{display:block;white-space:pre}
  .row.hd{justify-content:space-between}
  .row.ttl{justify-content:center}
  .row.ttl span{border-bottom:calc(var(--mm) * .6) solid var(--pen);padding:0 calc(var(--mm) * 3) calc(var(--mm) * .3)}
  .row.q{font-weight:800}
  .row.sub{padding-left:calc(var(--mm) * 9)}
  .opx{display:inline-block;margin:0 calc(var(--mm) * 2)}
  .lbl{margin-right:calc(var(--mm) * 1.5)}
  .bl{display:inline-block;position:relative;height:calc(var(--mm) * 5.6);border-bottom:calc(var(--mm) * .4) solid var(--pen);margin:0 calc(var(--mm) * 1.3);vertical-align:bottom}
  .bl .a{position:absolute;left:0;right:0;bottom:calc(var(--mm) * .6);text-align:center;color:var(--pencil);font-weight:800;opacity:0;white-space:nowrap;text-shadow:0 0 .4px rgba(0,0,0,.35)}
  .paper.ans .bl .a{opacity:1}
  .paper.ans .bl{border-bottom-color:rgba(26,71,209,.4)}
  .op{margin:0 calc(var(--mm) * .6)}
  .pi{font-family:"Times New Roman","STIX Two Text",Georgia,serif;font-style:italic;font-weight:700}
  .sheetbar{flex:none;display:flex;gap:10px}
  /* the win card */
  #win{position:fixed;inset:0;z-index:18;display:grid;place-items:center;background:rgba(17,24,39,.45);padding:12px}
  .wcard{background:#fff;border-radius:20px;padding:18px 20px;box-shadow:0 0 0 1px var(--line),0 18px 44px rgba(16,24,40,.25);text-align:center;max-width:min(92vw,380px);display:grid;gap:10px}
  .wcard h2{margin:0;font-size:clamp(20px,6vw,26px);font-weight:700}
  .wcard p{margin:0;color:var(--muted);font-size:clamp(14px,3.8vw,16px);line-height:1.35}
  .wrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  #cv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:19}
  .nojs{padding:20px;text-align:center}
  @media (max-width:470px){#ramp{grid-column:1/-1;grid-row:2;max-width:none;height:clamp(10px,2vh,16px)}}
  @media (max-width:470px) and (max-height:420px){#ramp{display:none}}
  @media (max-width:360px){.bt svg{display:none}.bt{padding:0 11px}#again svg{display:block}}
  @media (max-width:345px){.ib span{display:none}.ib{padding:0 10px}header{gap:6px 8px;padding:8px 10px 2px}#ramp{gap:3px}}
  @media (max-width:300px){#ramp{display:none}header{grid-template-columns:auto 1fr auto}#again span{display:none}}
  @media (max-width:270px){h1{font-size:15px}h1 svg{display:none}.ib{min-width:36px;min-height:36px}.bt{padding:0 9px}footer{gap:6px}}
  @media (max-height:520px){.credit{display:none}header{padding-top:6px}}
  @media (max-height:420px){header{padding-top:4px}footer{padding:3px 12px 6px}main{padding:2px 8px}}
  @media (prefers-reduced-motion:reduce){.ib .dot,.bt.ready{animation:none}}
</style>
</head>

<header>
  <h1><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="8" width="48" height="48" rx="13" fill="#e8ecff" stroke="#4f46e5" stroke-width="6"/><circle cx="24" cy="27" r="4.5" fill="#2b1a4d"/><circle cx="40" cy="27" r="4.5" fill="#2b1a4d"/><path d="M22 40q10 9 20 0" fill="none" stroke="#2b1a4d" stroke-width="4.5" stroke-linecap="round"/></svg>Factor Pop</h1>
  <div id="ramp" aria-label="The stages"></div>
  <div class="hb">
    <button class="ib" id="nbtn" type="button" aria-label="Notebook page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6z"/><path d="M6 3v18M10 8h6M10 12h6M10 16h4"/></svg><span>Notebook</span><i class="dot" id="ndot"></i></button>

<footer>

</footer>
<div class="credit">Made by: <b>Mr. Hamza Ashour</b></div>
<div id="sheet" hidden role="dialog" aria-modal="true" aria-label="Notebook page">
  <div id="paperbox"><div class="paper" id="paper"></div></div>
  <div class="sheetbar"><button class="bt" id="sans" type="button">Show answers</button><button class="bt go" id="sclose" type="button">Close</button></div>
</div>
<div id="win" hidden role="dialog" aria-modal="true" aria-labelledby="wint">
  <div class="wcard">
    <h2 id="wint">All 7 done!</h2>
    <p>Now write your notebook page.</p>
    <div class="wrow"><button class="bt" id="wnote" type="button">Notebook</button><button class="bt go" id="wagain" type="button">Play again</button></div>
  </div>
</div>
